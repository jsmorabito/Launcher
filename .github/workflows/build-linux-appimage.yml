name: Build Linux AppImage

# Unsigned, amd64-only build for installing the app on a Linux machine without
# the updater signing secrets. Publishes a GitHub pre-release whose asset names
# match what install.sh looks for. Use release-launcher.yml for full releases.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.1.1-54)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: launcher-app
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev xdg-utils zsync
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v5
        with:
          version: 10.26.0
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: launcher-app/src-tauri -> target
          key: linux-amd64

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Sync SvelteKit
        run: pnpm svelte-kit sync

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build ext-builder sidecar JS
        working-directory: launcher-ext-builder
        run: |
          bun install
          bun run build:js

      - name: Install ldd shim (linuxdeploy + bun workaround)
        run: sudo install -m 0755 scripts/ci/ldd-shim.sh /usr/local/bin/ldd

      - name: Install linuxdeploy with library exclusion support
        run: |
          set -euo pipefail
          tauri_tools_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/tauri"
          mkdir -p "$tauri_tools_dir"
          curl -L --fail --show-error --retry 3 \
            -o "$tauri_tools_dir/linuxdeploy-x86_64.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          chmod 0755 "$tauri_tools_dir/linuxdeploy-x86_64.AppImage"

      - name: Build AppImage (unsigned)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          LINUXDEPLOY_EXCLUDED_LIBRARIES: 'libwayland-client.so*'
        run: |
          pnpm tauri build -v --target x86_64-unknown-linux-gnu --bundles appimage \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'
          install -m 0755 src-tauri/binaries/launcher-summon-x86_64-unknown-linux-gnu \
            src-tauri/target/x86_64-unknown-linux-gnu/release/launcher-summon_amd64

      - name: Publish pre-release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          out=launcher-app/src-tauri/target/x86_64-unknown-linux-gnu/release
          gh release create "$TAG" --prerelease --generate-notes --title "$TAG" \
            "$out"/bundle/appimage/*.AppImage "$out/launcher-summon_amd64"
